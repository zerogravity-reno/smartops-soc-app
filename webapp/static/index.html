<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SmartOps SOC</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<header class="topbar">
  <span class="brand">SmartOps SOC</span>
  <span class="topbar-sub">Alert investigation</span>
  <span id="conn" class="conn" role="status" aria-live="polite">Idle</span>
</header>

<div class="shell">

  <aside class="queue" aria-labelledby="queueTitle">
    <div class="queue-head">
      <h2 id="queueTitle">Incident queue</h2>
      <button id="queueRefresh" class="btn-ghost" type="button">Refresh</button>
    </div>
    <ol id="queueList" class="queue-list" aria-busy="true"></ol>
  </aside>

  <main class="work">

    <section id="alertPanel" class="panel" aria-labelledby="alertTitle">
      <div class="panel-head">
        <h2 id="alertTitle">Alert</h2>
        <span id="runClock" class="clock" aria-live="off"></span>
      </div>
      <div id="alertSummary" class="fold-line" hidden>
        <span id="alertSummaryText"></span>
        <button id="alertEdit" class="btn-ghost" type="button">Edit</button>
      </div>
      <p id="alertNote" class="note">Pick an alert from the queue, or fill the fields by hand.</p>
      <form id="alertForm" class="fields" novalidate>
        <label class="field full">Detection rule
          <input id="f_rule" name="rule_name" required />
        </label>
        <label class="field">Source IP <input id="f_src" /></label>
        <label class="field">Destination host <input id="f_dest" /></label>
        <label class="field">User <input id="f_user" /></label>
        <label class="field">File hash <input id="f_hash" /></label>
        <label class="field">Domain <input id="f_domain" /></label>
        <label class="field">MITRE technique <input id="f_mitre" /></label>
        <label class="field">Signature <input id="f_sig" /></label>
        <label class="field full">Deployed SPL
          <textarea id="f_spl" rows="3"></textarea>
        </label>
        <p id="formError" class="field-error full" role="alert"></p>
        <div class="actions full">
          <button id="runBtn" class="btn-primary" type="submit">Investigate</button>
        </div>
      </form>
    </section>

    <ol id="stages" class="stages" aria-label="Pipeline progress">
      <li data-stage="context"><button type="button">Context</button></li>
      <li data-stage="plan"><button type="button">Plan</button></li>
      <li data-stage="broker"><button type="button">Broker</button></li>
      <li data-stage="synthesis"><button type="button">Synthesis</button></li>
      <li data-stage="verdict"><button type="button">Verdict</button></li>
    </ol>

    <section id="verdict" class="verdict" hidden aria-live="polite"></section>

    <section id="stream" class="stream" aria-label="Live investigation" aria-live="polite"></section>

    <details id="contextBox" class="panel raw" hidden>
      <summary>Context sent to the pipeline</summary>
      <h3>Context contract</h3><pre id="contractOut"></pre>
      <h3>ESCU match</h3><pre id="escuOut"></pre>
      <h3>OpenCTI lookup</h3><pre id="ctiOut"></pre>
    </details>

  </main>
</div>

<div id="toast" class="toast" role="status" hidden></div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
