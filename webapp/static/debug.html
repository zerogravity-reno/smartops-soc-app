<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartOps SOC — Debug View</title>
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --border: #30363d;
    --text: #c9d1d9; --muted: #8b949e; --green: #3fb950;
    --yellow: #d29922; --red: #f85149; --blue: #58a6ff;
    --purple: #bc8cff; --orange: #ffa657;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', monospace; font-size: 14px; }
  header { background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 18px; font-weight: 600; color: var(--blue); }
  header span { color: var(--muted); font-size: 12px; }
  #controls { padding: 20px 24px; display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
  #controls label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  #controls input, #controls select {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 8px 12px; border-radius: 6px; font-size: 13px; width: 300px;
  }
  #controls input:focus, #controls select:focus { outline: none; border-color: var(--blue); }
  button#run-btn {
    background: var(--blue); color: #000; border: none; padding: 9px 20px;
    border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px;
  }
  button#run-btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
  button#run-btn:hover:not(:disabled) { background: #79c0ff; }
  #status-bar { padding: 0 24px 12px; font-size: 12px; color: var(--muted); }
  #status-bar .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--muted); }
  #status-bar.running .dot { background: var(--green); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  main { padding: 0 24px 40px; display: flex; flex-direction: column; gap: 20px; }

  /* Step cards */
  .step-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
    animation: fadeIn .3s ease;
  }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
  .step-header {
    padding: 12px 18px; display: flex; align-items: center; gap: 10px;
    cursor: pointer; user-select: none; border-bottom: 1px solid var(--border);
  }
  .step-header:hover { background: rgba(255,255,255,.03); }
  .step-badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
  .badge-analyst  { background: rgba(88,166,255,.15); color: var(--blue); }
  .badge-broker   { background: rgba(255,166,87,.15); color: var(--orange); }
  .badge-synthesis{ background: rgba(188,140,255,.15); color: var(--purple); }
  .badge-verdict  { background: rgba(63,185,80,.15); color: var(--green); }
  .badge-error    { background: rgba(248,81,73,.15); color: var(--red); }
  .step-title { font-weight: 600; flex: 1; }
  .step-time  { font-size: 11px; color: var(--muted); }
  .step-chevron { color: var(--muted); transition: transform .2s; }
  .step-card.collapsed .step-chevron { transform: rotate(-90deg); }
  .step-body { padding: 0; }
  .step-card.collapsed .step-body { display: none; }

  /* Sections inside a card */
  .section { border-bottom: 1px solid var(--border); padding: 14px 18px; }
  .section:last-child { border-bottom: none; }
  .section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; }

  /* Reasoning box */
  .reasoning-box {
    background: #0d1117; border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 14px; font-size: 12px; color: var(--muted); font-family: monospace;
    max-height: 160px; overflow-y: auto; line-height: 1.5; white-space: pre-wrap;
  }

  /* Hypothesis cards */
  .hyp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @media(max-width:800px){ .hyp-grid{ grid-template-columns:1fr; } }
  .hyp-card { border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .hyp-card.TP { border-color: rgba(248,81,73,.5); }
  .hyp-card.FP { border-color: rgba(210,153,34,.5); }
  .hyp-card.BN { border-color: rgba(88,166,255,.5); }
  .hyp-verdict { font-size: 11px; font-weight: 700; margin-bottom: 6px; }
  .hyp-card.TP .hyp-verdict { color: var(--red); }
  .hyp-card.FP .hyp-verdict { color: var(--yellow); }
  .hyp-card.BN .hyp-verdict { color: var(--blue); }
  .hyp-desc { font-size: 12px; color: var(--text); line-height: 1.5; }
  .hyp-score-bar { margin-top: 8px; height: 4px; background: var(--border); border-radius: 2px; }
  .hyp-score-fill { height: 100%; border-radius: 2px; transition: width .8s ease; }
  .hyp-card.TP .hyp-score-fill { background: var(--red); }
  .hyp-card.FP .hyp-score-fill { background: var(--yellow); }
  .hyp-card.BN .hyp-score-fill { background: var(--blue); }
  .hyp-score-label { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* Tasks list */
  .task-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .task-item { background: #0d1117; border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; display: flex; gap: 10px; align-items: baseline; }
  .task-id { font-size: 11px; font-weight: 700; color: var(--muted); min-width: 32px; }
  .task-q  { font-size: 12px; color: var(--text); line-height: 1.4; }

  /* Broker results */
  .tool-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media(max-width:700px){ .tool-grid{ grid-template-columns:1fr; } }
  .tool-card { border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .tool-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .tool-name { font-weight: 600; font-size: 13px; }
  .tool-status { font-size: 11px; padding: 2px 7px; border-radius: 4px; font-weight: 600; }
  .tool-ok       { background: rgba(63,185,80,.15); color: var(--green); }
  .tool-rejected { background: rgba(248,81,73,.15); color: var(--red); }
  .tool-detail { font-size: 12px; color: var(--muted); line-height: 1.5; }
  pre.vt-raw { background: #0d1117; border: 1px solid var(--border); border-radius: 6px; padding: 10px; font-size: 11px; max-height: 200px; overflow-y: auto; color: var(--text); white-space: pre-wrap; }

  /* Verdict */
  .verdict-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .verdict-badge { font-size: 16px; font-weight: 700; padding: 6px 16px; border-radius: 8px; }
  .verdict-TP { background: rgba(248,81,73,.2); color: var(--red); border: 1px solid rgba(248,81,73,.4); }
  .verdict-FP { background: rgba(210,153,34,.2); color: var(--yellow); border: 1px solid rgba(210,153,34,.4); }
  .verdict-BN { background: rgba(88,166,255,.2); color: var(--blue); border: 1px solid rgba(88,166,255,.4); }
  .verdict-RI { background: rgba(139,148,158,.2); color: var(--muted); border: 1px solid var(--border); }
  .confidence { font-size: 22px; font-weight: 700; color: var(--green); }
  .confidence small { font-size: 12px; color: var(--muted); font-weight: 400; }
  .verdict-reasoning { font-size: 13px; color: var(--text); line-height: 1.6; margin-top: 12px; }

  /* Gaps + follow-ups */
  .gap-list, .fu-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .gap-item { background: rgba(248,81,73,.05); border: 1px solid rgba(248,81,73,.2); border-radius: 6px; padding: 7px 12px; font-size: 12px; color: var(--red); }
  .fu-item  { background: rgba(88,166,255,.05); border: 1px solid rgba(88,166,255,.2); border-radius: 6px; padding: 7px 12px; font-size: 12px; color: var(--blue); }

  /* Token bar */
  .token-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .token-chip { background: #0d1117; border: 1px solid var(--border); border-radius: 6px; padding: 5px 12px; font-size: 12px; }
  .token-chip span { color: var(--blue); font-weight: 600; }

  /* Spinner */
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to{transform:rotate(360deg)} }

  /* Raw JSON toggle */
  details summary { font-size: 11px; color: var(--muted); cursor: pointer; padding: 6px 0; }
  details pre { background: #0d1117; border: 1px solid var(--border); border-radius: 6px; padding: 10px; font-size: 11px; max-height: 300px; overflow-y: auto; white-space: pre-wrap; color: var(--text); margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1>SmartOps SOC</h1>
  <span>Debug View — Real-time Step Inspector</span>
</header>

<div id="controls">
  <div>
    <label>Alert Name</label>
    <input id="alert-name" value="Potential Cryptomining Activity Detected">
  </div>
  <div>
    <label>Host</label>
    <input id="alert-host" value="BSTOLL-L" style="width:150px">
  </div>
  <div>
    <label>Domain</label>
    <input id="alert-domain" value="coinhive.com" style="width:180px">
  </div>
  <div>
    <label>Event Time</label>
    <input id="alert-time" value="2018-08-20T12:00:00Z" style="width:200px">
  </div>
  <div>
    <label>Max Loops</label>
    <select id="max-loops" style="width:80px">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3" selected>3</option>
    </select>
  </div>
  <button id="run-btn" onclick="runInvestigation()">Run Investigation</button>
</div>
<div id="status-bar"><span class="dot"></span><span id="status-text">Ready</span></div>

<main id="steps"></main>

<script>
let evtSource = null;

function runInvestigation() {
  const btn = document.getElementById('run-btn');
  const stepsEl = document.getElementById('steps');
  const statusBar = document.getElementById('status-bar');
  const statusText = document.getElementById('status-text');

  btn.disabled = true;
  stepsEl.innerHTML = '';
  statusBar.className = 'running';

  const payload = {
    alert_name: document.getElementById('alert-name').value,
    host: document.getElementById('alert-host').value,
    domain: document.getElementById('alert-domain').value,
    event_time: document.getElementById('alert-time').value,
    max_loops: parseInt(document.getElementById('max-loops').value)
  };

  // Use SSE via POST workaround: POST first, then SSE
  fetch('/api/run', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  }).then(r => r.json()).then(d => {
    const runId = d.run_id;
    statusText.textContent = 'Investigation running... (run: ' + runId + ')';
    evtSource = new EventSource('/api/run/stream/' + runId);
    evtSource.onmessage = e => handleEvent(JSON.parse(e.data));
    evtSource.onerror = () => { evtSource.close(); btn.disabled = false; statusBar.className=''; statusText.textContent='Stream ended'; };
  }).catch(err => { btn.disabled = false; statusBar.className=''; statusText.textContent = 'Error: ' + err; });
}

function handleEvent(ev) {
  const stepsEl = document.getElementById('steps');
  const statusText = document.getElementById('status-text');
  statusText.textContent = ev.message || ev.type;

  if (ev.type === 'done') {
    document.getElementById('run-btn').disabled = false;
    document.getElementById('status-bar').className = '';
    statusText.textContent = 'Investigation complete';
    if (evtSource) evtSource.close();
    return;
  }
  if (ev.type === 'error') {
    addErrorCard(ev.message);
    document.getElementById('run-btn').disabled = false;
    document.getElementById('status-bar').className = '';
    return;
  }

  const card = buildCard(ev);
  if (card) stepsEl.appendChild(card);
  card && card.scrollIntoView({behavior:'smooth', block:'start'});
}

function buildCard(ev) {
  if (ev.type === 'analyst')   return buildAnalystCard(ev);
  if (ev.type === 'broker')    return buildBrokerCard(ev);
  if (ev.type === 'synthesis') return buildSynthesisCard(ev);
  if (ev.type === 'verdict')   return buildVerdictCard(ev);
  return null;
}

function card(badgeClass, badgeLabel, title, loop, bodyHtml) {
  const d = document.createElement('div');
  d.className = 'step-card';
  d.innerHTML = `
    <div class="step-header" onclick="this.parentElement.classList.toggle('collapsed')">
      <span class="step-badge ${badgeClass}">${badgeLabel}</span>
      <span class="step-title">${title}</span>
      ${loop ? `<span class="step-time">Loop ${loop}</span>` : ''}
      <span class="step-chevron">&#8964;</span>
    </div>
    <div class="step-body">${bodyHtml}</div>`;
  return d;
}

function buildAnalystCard(ev) {
  const d = ev.data;
  const hyps = (d.hypotheses || []).map(h => {
    const cls = h.verdict === 'TRUE_POSITIVE' ? 'TP' : h.verdict === 'FALSE_POSITIVE' ? 'FP' : 'BN';
    return `<div class="hyp-card ${cls}">
      <div class="hyp-verdict">${h.verdict}</div>
      <div class="hyp-desc">${h.description || ''}</div>
    </div>`;
  }).join('');

  const tasks = (d.tasks || []).map(t => {
    const q = typeof t === 'string' ? t : (t.question || JSON.stringify(t));
    const id = typeof t === 'string' ? '?' : (t.task_id || '?');
    return `<li class="task-item"><span class="task-id">${id}</span><span class="task-q">${q}</span></li>`;
  }).join('');

  const body = `
    <div class="section">
      <div class="section-title">Model Reasoning</div>
      <div class="reasoning-box">${escHtml(d.reasoning || d.model_reasoning || '')}</div>
    </div>
    <div class="section">
      <div class="section-title">Hypotheses</div>
      <div class="hyp-grid">${hyps}</div>
    </div>
    <div class="section">
      <div class="section-title">Investigation Tasks (${(d.tasks||[]).length})</div>
      <ul class="task-list">${tasks}</ul>
    </div>
    <div class="section">
      <div class="section-title">SPL Alignment</div>
      <div style="font-size:13px"><strong style="color:${d.semantic_alignment==='ALIGNED'?'var(--green)':'var(--yellow)'}">${d.semantic_alignment||'—'}</strong>
      ${d.alignment_reasoning ? ' — ' + escHtml(d.alignment_reasoning) : ''}</div>
    </div>
    <div class="section">
      <div class="section-title">Tokens</div>
      <div class="token-row">
        <div class="token-chip">Prompt <span>${ev.tokens?.prompt||0}</span></div>
        <div class="token-chip">Generation <span>${ev.tokens?.generation||0}</span></div>
        <div class="token-chip">Stop <span>${ev.tokens?.stop_reason||'—'}</span></div>
      </div>
    </div>
    <div class="section"><details><summary>Raw JSON</summary><pre>${escHtml(JSON.stringify(d, null, 2))}</pre></details></div>`;

  return card('badge-analyst', 'ANALYST', 'Planning Mode — Hypotheses & Tasks', null, body);
}

function buildBrokerCard(ev) {
  const d = ev.data;
  const results = d.results || [];
  const tools = ['siem','edr','vt','ndr'];
  const toolCards = tools.map(t => {
    const r = results.find(x => (x.task_id||'').includes(t)) || {};
    const ok = r.status === 'ok';
    const detail = r.detail || r.reason || r.error || (ok ? 'Data retrieved' : 'No MCP server configured');
    return `<div class="tool-card">
      <div class="tool-header">
        <span class="tool-name">${t.toUpperCase()}</span>
        <span class="tool-status ${ok?'tool-ok':'tool-rejected'}">${ok?'OK':'Rejected'}</span>
      </div>
      <div class="tool-detail">${escHtml(typeof detail === 'string' ? detail : JSON.stringify(detail))}</div>
      ${r.vt_data ? `<pre class="vt-raw">${escHtml(JSON.stringify(r.vt_data, null, 2))}</pre>` : ''}
    </div>`;
  }).join('');

  const body = `
    <div class="section">
      <div class="section-title">Fetch Plan (${(d.plan?.steps||[]).length} steps)</div>
      <ul class="task-list">${(d.plan?.steps||[]).map(s=>`<li class="task-item"><span class="task-id">${s.step_id}</span><span class="task-q">[${s.family}] ${s.objective}</span></li>`).join('')}</ul>
    </div>
    <div class="section">
      <div class="section-title">Tool Results</div>
      <div class="tool-grid">${toolCards}</div>
    </div>
    <div class="section"><details><summary>Raw Findings JSON</summary><pre>${escHtml(JSON.stringify(d, null, 2).slice(0, 4000))}</pre></details></div>`;

  return card('badge-broker', 'BROKER', 'Subagents Dispatch — Splunk / VT', ev.loop, body);
}

function buildSynthesisCard(ev) {
  const d = ev.data;
  const scores = d.hypothesis_scores || {};
  const hyps = ['H1','H2','H3'];
  const scoreHtml = hyps.map(h => {
    const s = scores[h] || 0;
    const color = s >= 85 ? 'var(--red)' : s >= 60 ? 'var(--yellow)' : 'var(--blue)';
    return `<div class="hyp-card" style="flex:1">
      <div class="hyp-verdict" style="color:${color}">${h}</div>
      <div class="hyp-score-bar"><div class="hyp-score-fill" style="width:${s}%;background:${color}"></div></div>
      <div class="hyp-score-label">${s}/100</div>
    </div>`;
  }).join('');

  const gaps = (d.evidence_gaps || []).map(g => `<li class="gap-item">${escHtml(g)}</li>`).join('');
  const fus  = (d.follow_up_tasks || []).map(f => {
    const q = typeof f === 'string' ? f : (f.question || JSON.stringify(f));
    return `<li class="fu-item">${escHtml(q)}</li>`;
  }).join('');

  const statusColor = d.status === 'VERDICT_REACHED' ? 'var(--green)' : 'var(--yellow)';

  const body = `
    <div class="section">
      <div class="section-title">Status</div>
      <div style="font-size:14px;font-weight:700;color:${statusColor}">${d.status || 'unknown'}</div>
    </div>
    <div class="section">
      <div class="section-title">Hypothesis Scores</div>
      <div class="hyp-grid">${scoreHtml}</div>
    </div>
    <div class="section">
      <div class="section-title">Reasoning</div>
      <div class="reasoning-box">${escHtml(ev.reasoning || '')}</div>
    </div>
    ${gaps ? `<div class="section"><div class="section-title">Evidence Gaps</div><ul class="gap-list">${gaps}</ul></div>` : ''}
    ${fus  ? `<div class="section"><div class="section-title">Follow-up Tasks</div><ul class="fu-list">${fus}</ul></div>` : ''}
    <div class="section">
      <div class="section-title">Tokens</div>
      <div class="token-row">
        <div class="token-chip">Prompt <span>${ev.tokens?.prompt||0}</span></div>
        <div class="token-chip">Generation <span>${ev.tokens?.generation||0}</span></div>
      </div>
    </div>
    <div class="section"><details><summary>Raw JSON</summary><pre>${escHtml(JSON.stringify(d, null, 2))}</pre></details></div>`;

  return card('badge-synthesis', 'SYNTHESIS', 'Evaluation Mode — Scoring & Verdict', ev.loop, body);
}

function buildVerdictCard(ev) {
  const d = ev.data;
  const vClass = d.verdict === 'TRUE_POSITIVE' ? 'verdict-TP' : d.verdict === 'FALSE_POSITIVE' ? 'verdict-FP' : d.verdict === 'BENIGN' ? 'verdict-BN' : 'verdict-RI';
  const body = `
    <div class="section">
      <div class="verdict-row">
        <div class="verdict-badge ${vClass}">${d.verdict}</div>
        <div class="confidence">${d.verdict_confidence || '—'}<small>/100</small></div>
      </div>
      <div class="verdict-reasoning">${escHtml(d.verdict_reasoning || d.reasoning || '')}</div>
    </div>`;
  return card('badge-verdict', 'VERDICT', 'Investigation Complete', null, body);
}

function addErrorCard(msg) {
  const d = document.createElement('div');
  d.className = 'step-card';
  d.innerHTML = `<div class="step-header"><span class="step-badge badge-error">ERROR</span><span class="step-title">${escHtml(msg)}</span></div>`;
  document.getElementById('steps').appendChild(d);
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
