[project]
name = "smartops-backend"
version = "0.1.0"
description = "SmartOps SOC triage/IR engine: budget, subagents, aggregator"
requires-python = ">=3.13"
dependencies = [
    "smartops-contracts",
    "pydantic>=2.9",
    # Pinned exactly: several APIs this package relies on are real in 1.50.2 but
    # absent from strandsagents.com, which documents an older surface. A minor
    # bump could move them without notice, so the tests are the contract.
    "strands-agents[otel]==1.50.2",
    "opentelemetry-api>=1.20",
]

[project.scripts]
smartops-broker = "smartops.main:run"

[tool.uv.sources]
smartops-contracts = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartops"]
