[tool.uv.workspace]
members = ["contracts", "backend"]

[tool.ruff]
line-length = 100
target-version = "py313"

# At the root rather than per-member so a bare `pytest` from the repo root
# collects both workspace members. It previously lived only in backend/, so
# running pytest from the root failed every async test with "async def
# functions are not natively supported". Also covers contracts/ for any future
# async test there.
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["contracts/tests", "backend/tests"]

# Strands deprecations must fail the suite, not scroll past it. The Broker spent
# an unknown number of runs passing `smartops=request` through the `**kwargs`
# channel Strands warns is deprecating; it fired on every invocation and nothing
# was configured to surface it.
#
# Both categories, deliberately. Strands is inconsistent about which it uses:
# most calls pass DeprecationWarning, `models/bedrock.py` passes UserWarning, and
# the two `**kwargs` deprecations (`agent/agent.py`, `multiagent/base.py`) pass no
# category at all -- which defaults to UserWarning. A DeprecationWarning-only
# filter would have missed the exact warning that motivated this.
#
# Not scoped to a module: Strands warns with `stacklevel=2`, so the warning is
# attributed to *our* calling module, and a `:strands.*` filter would match
# nothing while reading as protection.
#
# The baseline is zero warnings across the suite, so this is not currently
# suppressing anything. If a third-party dependency starts warning, add a
# targeted `"ignore:<message regex>:<Category>"` line above rather than weakening
# these -- the point is that a new warning is a decision, not a scroll-by.
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    "error::UserWarning",
]
