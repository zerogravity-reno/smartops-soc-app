[project]
name = "smartops-soc"
version = "1.0.0"
description = "SmartOps SOC — Unified Web UI + Engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "boto3>=1.34",
    "botocore>=1.34",
    "rank-bm25>=0.2.2",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[tool.uv.workspace]
members = ["engine"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
