<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 1140" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b91c1c"/>
    </marker>
    <style>
      .title{font-size:34px;font-weight:700;fill:#0f172a}
      .subtitle{font-size:17px;fill:#475569}
      .box-title{font-size:20px;font-weight:700}
      .box-sub{font-size:14px}
      .lbl{font-size:14px;fill:#334155}
      .lbl-i{font-size:13px;font-style:italic;fill:#64748b}
      .chip{font-size:13px;font-weight:600}
      .note{font-size:13px;fill:#475569}
      .badge{font-size:12px;font-weight:700}
    </style>
  </defs>

  <rect x="0" y="0" width="1640" height="1140" fill="#ffffff"/>
  <text x="60" y="58" class="title">SmartOps SOC &#8212; Task Broker Architecture</text>
  <text x="60" y="86" class="subtitle">One LLM agent decides which domains to engage; isolated domain subagents decide what to ask. Raw evidence is assembled by code and never re-enters the Broker's context.</text>

  <!-- ============ ANALYST ============ -->
  <rect x="620" y="120" width="400" height="72" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="820" y="150" text-anchor="middle" class="box-title" fill="#3730a3">Analyst Agent</text>
  <text x="820" y="176" text-anchor="middle" class="box-sub" fill="#4338ca">forms the hypothesis &#183; names no tool</text>

  <!-- Analyst -> Broker -->
  <path d="M820,192 L820,236" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="838" y="198" width="330" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="852" y="220" class="lbl"><tspan font-weight="700">AnalystTask</tspan> &#8212; goal + Scope (entities, time window)</text>

  <!-- ============ BROKER (big container) ============ -->
  <rect x="120" y="248" width="1400" height="300" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="150" y="288" class="box-title" fill="#1e3a8a">Task Broker</text>
  <text x="150" y="311" class="box-sub" fill="#1e40af">a single Strands Agent &#8212; its choice of which tool to call <tspan font-style="italic">is</tspan> the classification (no separate classifier call)</text>

  <!-- plan_fetch tool -->
  <rect x="150" y="336" width="300" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="366" text-anchor="middle" class="chip" fill="#1e3a8a">plan_fetch()  tool</text>
  <text x="300" y="392" text-anchor="middle" class="note">authors a FetchPlan first, so</text>
  <text x="300" y="411" text-anchor="middle" class="note">code can validate it before</text>
  <text x="300" y="430" text-anchor="middle" class="note">any dispatch happens</text>

  <!-- tool-gate -->
  <rect x="486" y="336" width="250" height="120" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="611" y="362" text-anchor="middle" class="chip" fill="#854d0e">Tool gate</text>
  <text x="611" y="386" text-anchor="middle" class="note">available_broker_tools()</text>
  <text x="611" y="406" text-anchor="middle" class="note">drops any family with no</text>
  <text x="611" y="425" text-anchor="middle" class="note">native tools &amp; no MCP client</text>
  <text x="611" y="444" text-anchor="middle" class="lbl-i">precondition, not judgement</text>

  <!-- investigate_<family> tools -->
  <rect x="772" y="336" width="360" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="952" y="362" text-anchor="middle" class="chip" fill="#1e3a8a">investigate_&lt;family&gt;()  tools</text>
  <text x="952" y="384" text-anchor="middle" class="note">one typed @tool per CONFIGURED family</text>
  <rect x="792" y="398" width="150" height="40" rx="6" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="867" y="423" text-anchor="middle" class="chip" fill="#1e3a8a">investigate_siem</text>
  <rect x="962" y="398" width="150" height="40" rx="6" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="1037" y="423" text-anchor="middle" class="chip" fill="#1e3a8a">investigate_vt</text>

  <!-- trailing structured output -->
  <rect x="1168" y="336" width="330" height="120" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1333" y="362" text-anchor="middle" class="chip" fill="#334155">TaskClassification</text>
  <text x="1333" y="386" text-anchor="middle" class="note">the Broker's <tspan font-weight="700">trailing</tspan> output</text>
  <text x="1333" y="406" text-anchor="middle" class="note">&#8212; a report of what was</text>
  <text x="1333" y="425" text-anchor="middle" class="note">dispatched, not a decision</text>
  <text x="1333" y="444" text-anchor="middle" class="note">about what to dispatch</text>

  <!-- Broker holds digests only note -->
  <rect x="1158" y="474" width="350" height="56" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1333" y="498" text-anchor="middle" class="badge" fill="#991b1b">Broker context = digests only</text>
  <text x="1333" y="518" text-anchor="middle" class="note" fill="#991b1b">raw tool output never lands here</text>

  <!-- dispatch arrow down -->
  <path d="M867,456 L867,600" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#arrowBlue)"/>
  <rect x="885" y="500" width="360" height="52" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="899" y="522" class="lbl"><tspan font-weight="700">SubagentMission</tspan> &#8212; minted from one step:</text>
  <text x="899" y="541" class="lbl">family, objective, scope copied. Carries no query.</text>

  <!-- ============ ISOLATION BOUNDARY ============ -->
  <line x1="120" y1="600" x2="1520" y2="600" stroke="#b91c1c" stroke-width="2" stroke-dasharray="10 6"/>
  <rect x="120" y="588" width="300" height="24" rx="4" fill="#ffffff"/>
  <text x="128" y="606" class="badge" fill="#b91c1c">&#9472;&#9472; context isolation boundary &#9472;&#9472;</text>

  <!-- ============ DOMAIN SUBAGENT ============ -->
  <rect x="120" y="628" width="740" height="330" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/>
  <text x="150" y="666" class="box-title" fill="#115e59">Domain Subagent</text>
  <text x="150" y="689" class="box-sub" fill="#0f766e">one body, all families &#183; own model, own context, own toolset &#183; bounded loop (&#8804;14 turns)</text>

  <!-- entity gate -->
  <rect x="150" y="706" width="330" height="100" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="315" y="732" text-anchor="middle" class="chip" fill="#115e59">Entity gate (required_kinds)</text>
  <text x="315" y="756" text-anchor="middle" class="note">a family with no entity of the</text>
  <text x="315" y="775" text-anchor="middle" class="note">kind it needs is refused &#8212; in</text>
  <text x="315" y="794" text-anchor="middle" class="note">code, before any model call</text>

  <!-- model loop -->
  <rect x="510" y="706" width="320" height="100" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="670" y="732" text-anchor="middle" class="chip" fill="#115e59">bounded model loop</text>
  <text x="670" y="756" text-anchor="middle" class="note">decides the queries, runs them,</text>
  <text x="670" y="775" text-anchor="middle" class="note">authors a SubagentAnswer</text>
  <text x="670" y="794" text-anchor="middle" class="note">(assessment + queries, no rows)</text>

  <!-- code assembly -->
  <rect x="150" y="826" width="680" height="112" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="490" y="852" text-anchor="middle" class="chip" fill="#065f46">Code assembly (not the model)</text>
  <text x="490" y="878" text-anchor="middle" class="note">tool output captured via AfterToolCallEvent &#8594; projected into typed SiemFindings / VtFindings</text>
  <text x="490" y="899" text-anchor="middle" class="note">Evidence minted with ids &amp; provenance &#183; citations minted by code &#183; every citation must resolve</text>
  <text x="490" y="922" text-anchor="middle" class="lbl-i" fill="#047857">a model that never sees the rows cannot invent them</text>

  <!-- ============ BACKENDS ============ -->
  <rect x="900" y="628" width="620" height="330" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
  <text x="930" y="666" class="box-title" fill="#92400e">Backends (real tools)</text>

  <!-- splunk -->
  <rect x="930" y="690" width="270" height="120" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="1065" y="718" text-anchor="middle" class="chip" fill="#92400e">Splunk  (SIEM)</text>
  <text x="1065" y="742" text-anchor="middle" class="note">over MCP &#183; 10 tools</text>
  <text x="1065" y="764" text-anchor="middle" class="note">CIM predicates only;</text>
  <text x="1065" y="785" text-anchor="middle" class="note">index=* is refused</text>

  <!-- vt -->
  <rect x="1230" y="690" width="270" height="120" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="1365" y="718" text-anchor="middle" class="chip" fill="#92400e">VirusTotal</text>
  <text x="1365" y="742" text-anchor="middle" class="note">REST &#183; 4 native tools</text>
  <text x="1365" y="764" text-anchor="middle" class="note">domain / ip / file_hash / url</text>
  <text x="1365" y="785" text-anchor="middle" class="note">needs no MCP server</text>

  <!-- edr / ndr not wired -->
  <rect x="930" y="826" width="570" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1215" y="855" text-anchor="middle" class="chip" fill="#64748b">edr  /  ndr  &#8212;  not wired</text>
  <text x="1215" y="877" text-anchor="middle" class="note" fill="#64748b">no vendor picked &#183; withheld from the Broker's toolset &#183; neither planned nor dispatched</text>

  <!-- subagent -> backends -->
  <path d="M830,756 L928,750" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="838" y="742" class="lbl-i" fill="#0f766e">queries</text>
  <path d="M928,772 L832,778" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="838" y="800" class="lbl-i" fill="#475569">raw results</text>

  <!-- ============ RETURN PATH ============ -->
  <rect x="300" y="1000" width="900" height="110" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="750" y="1030" text-anchor="middle" class="chip" fill="#991b1b">Only a digest crosses back up</text>
  <text x="750" y="1056" text-anchor="middle" class="note">SubtaskResult &#8594; _digest() &#8594; StepOutcome  (CompletionRule evaluated by code, per step)  &#8594; BrokerReport</text>
  <text x="750" y="1080" text-anchor="middle" class="note">completed &#183; evaluated &#183; rows_retrieved &#183; confirmed_empty &#183; refused_for_budget &#8212; the model never ticks its own boxes</text>
  <text x="750" y="1100" text-anchor="middle" class="lbl-i" fill="#991b1b">"we asked and found nothing" is a finding; "we never asked" is a gap</text>

  <!-- cross-cutting badges -->
  <rect x="60" y="1000" width="210" height="50" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="165" y="1021" text-anchor="middle" class="chip" fill="#6b21a8">Budget ledger</text>
  <text x="165" y="1040" text-anchor="middle" class="note" fill="#6b21a8">reserve &#8594; run &#8594; settle</text>

  <rect x="60" y="1060" width="210" height="50" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="165" y="1081" text-anchor="middle" class="chip" fill="#6b21a8">Guards</text>
  <text x="165" y="1100" text-anchor="middle" class="note" fill="#6b21a8">IndexScopeGuard &#183; plan guards</text>

  <!-- skill pack chip (opt-in capability of the siem subagent) -->
  <rect x="1238" y="1000" width="342" height="110" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1409" y="1026" text-anchor="middle" class="chip" fill="#115e59">Skill pack (opt-in)</text>
  <text x="1409" y="1050" text-anchor="middle" class="note" fill="#0f766e">superman-splunk attaches to the siem</text>
  <text x="1409" y="1069" text-anchor="middle" class="note" fill="#0f766e">subagent: a routing table + read_reference</text>
  <text x="1409" y="1088" text-anchor="middle" class="note" fill="#0f766e">tool (lazy-loaded guides).</text>
  <text x="1409" y="1104" text-anchor="middle" class="lbl-i" fill="#0f766e">off unless --skills</text>
</svg>
