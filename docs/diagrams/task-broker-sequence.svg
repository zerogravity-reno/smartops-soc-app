<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 1360" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="s-arrow" markerWidth="11" markerHeight="11" refX="9" refY="3.2" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3.2 L0,6.4 Z" fill="#1e293b"/>
    </marker>
    <marker id="s-arrow-open" markerWidth="13" markerHeight="13" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.4"/>
    </marker>
    <style>
      .title{font-size:34px;font-weight:700;fill:#0f172a}
      .subtitle{font-size:17px;fill:#475569}
      .head{font-size:19px;font-weight:700}
      .head-sub{font-size:13px}
      .msg{font-size:15px;fill:#0f172a}
      .msg-b{font-size:15px;font-weight:700;fill:#0f172a}
      .ret{font-size:14px;fill:#475569;font-style:italic}
      .frame-lbl{font-size:13px;font-weight:700;fill:#475569}
      .note{font-size:13px;fill:#78350f}
      .self{font-size:14px;fill:#0f172a}
    </style>
  </defs>

  <rect x="0" y="0" width="1660" height="1360" fill="#ffffff"/>
  <text x="60" y="56" class="title">SmartOps SOC &#8212; Task Broker Investigation Sequence</text>
  <text x="60" y="84" class="subtitle">One investigation, end to end. The model authors decisions (dashed structured output); code assembles evidence and evaluates completion.</text>

  <!-- ===== lifeline heads ===== -->
  <!-- Analyst @150, Broker @480, Code @830, Subagent @1180, Backends @1500 -->
  <g>
    <rect x="60" y="112" width="180" height="66" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="150" y="146" text-anchor="middle" class="head" fill="#3730a3">Analyst</text>
    <text x="150" y="167" text-anchor="middle" class="head-sub" fill="#4338ca">hypothesis</text>

    <rect x="380" y="112" width="200" height="66" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="480" y="146" text-anchor="middle" class="head" fill="#1e3a8a">Task Broker</text>
    <text x="480" y="167" text-anchor="middle" class="head-sub" fill="#1e40af">LLM agent</text>

    <rect x="720" y="112" width="220" height="66" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="830" y="146" text-anchor="middle" class="head" fill="#065f46">Code / Contracts</text>
    <text x="830" y="167" text-anchor="middle" class="head-sub" fill="#047857">validate &#183; project &#183; evaluate</text>

    <rect x="1080" y="112" width="200" height="66" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="1180" y="146" text-anchor="middle" class="head" fill="#115e59">Domain Subagent</text>
    <text x="1180" y="167" text-anchor="middle" class="head-sub" fill="#0f766e">own model &amp; context</text>

    <rect x="1410" y="112" width="190" height="66" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
    <text x="1505" y="146" text-anchor="middle" class="head" fill="#92400e">Backends</text>
    <text x="1505" y="167" text-anchor="middle" class="head-sub" fill="#b45309">Splunk MCP / VT REST</text>
  </g>

  <!-- ===== lifelines ===== -->
  <g stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 5">
    <line x1="150" y1="178" x2="150" y2="1300"/>
    <line x1="480" y1="178" x2="480" y2="1300"/>
    <line x1="830" y1="178" x2="830" y2="1300"/>
    <line x1="1180" y1="178" x2="1180" y2="1300"/>
    <line x1="1505" y1="178" x2="1505" y2="1300"/>
  </g>

  <!-- 1. Analyst -> Broker -->
  <line x1="150" y1="222" x2="474" y2="222" stroke="#1e293b" stroke-width="2.2" marker-end="url(#s-arrow)"/>
  <text x="160" y="214" class="msg"><tspan class="msg-b">1.</tspan> AnalystTask &#8212; goal + Scope (entities, time window); names no tool</text>

  <!-- 2. Broker -> Code plan_fetch -->
  <line x1="480" y1="272" x2="824" y2="272" stroke="#1e293b" stroke-width="2.2" marker-end="url(#s-arrow)"/>
  <text x="490" y="264" class="msg"><tspan class="msg-b">2.</tspan> plan_fetch(steps, rationale)</text>

  <!-- 3. Code self validate -->
  <path d="M830,300 h70 v26 h-64" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#s-arrow)"/>
  <text x="908" y="312" class="self" fill="#065f46">validate FetchPlan: step_id unique, family known</text>

  <!-- 4. Code -> Broker return -->
  <line x1="830" y1="360" x2="486" y2="360" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#s-arrow-open)"/>
  <text x="490" y="352" class="ret">FetchPlan accepted &#8212; the model never dispatches unplanned work</text>

  <!-- ===== OUTER LOOP frame ===== -->
  <rect x="380" y="392" width="1160" height="720" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.6"/>
  <path d="M380,392 h150 v26 l-16,14 h-134 z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="392" y="414" class="frame-lbl">loop  [per planned step]</text>
  <text x="546" y="414" class="frame-lbl" fill="#64748b">caps: 2 dispatches/step, 6/family</text>

  <!-- 5. Broker -> Code investigate_<family> -->
  <line x1="480" y1="460" x2="824" y2="460" stroke="#1e293b" stroke-width="2.2" marker-end="url(#s-arrow)"/>
  <text x="490" y="452" class="msg"><tspan class="msg-b">3.</tspan> investigate_&lt;family&gt;(question, step_id) &#8212; calling the tool <tspan font-style="italic">is</tspan> the routing decision</text>

  <!-- 6. Code self guards -->
  <path d="M830,488 h70 v26 h-64" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#s-arrow)"/>
  <text x="908" y="500" class="self" fill="#065f46">guards (plan / step_id / family) + entity gate + tool gate &#8212; preconditions in code</text>

  <!-- 7. Code -> Subagent mission -->
  <line x1="830" y1="548" x2="1174" y2="548" stroke="#1e293b" stroke-width="2.2" marker-end="url(#s-arrow)"/>
  <text x="840" y="540" class="msg"><tspan class="msg-b">4.</tspan> SubagentMission &#8212; minted from the step; carries no pre-authored query</text>

  <!-- budget reserve note -->
  <rect x="600" y="566" width="210" height="40" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.3"/>
  <text x="705" y="591" text-anchor="middle" class="note">Budget: reserve (a ceiling)</text>

  <!-- ===== INNER LOOP frame ===== -->
  <rect x="1080" y="628" width="460" height="230" rx="8" fill="none" stroke="#0d9488" stroke-width="1.6"/>
  <path d="M1080,628 h190 v26 l-16,14 h-174 z" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.4"/>
  <text x="1092" y="650" class="frame-lbl" fill="#115e59">loop  [subagent model loop &#8804; 14 turns]</text>

  <!-- 8. Subagent -> Backends -->
  <line x1="1180" y1="700" x2="1499" y2="700" stroke="#1e293b" stroke-width="2.2" marker-end="url(#s-arrow)"/>
  <text x="1092" y="692" class="msg" fill="#115e59"><tspan class="msg-b">5.</tspan> decides queries; batches independent ones into turn 1</text>

  <!-- 9. Backends -> Subagent raw -->
  <line x1="1505" y1="752" x2="1186" y2="752" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#s-arrow-open)"/>
  <text x="1190" y="744" class="ret">raw results (rows) &#8212; stay inside the subagent</text>

  <!-- 10. Code captures via hook (annotation inside inner loop) -->
  <rect x="1100" y="778" width="420" height="60" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.3"/>
  <text x="1310" y="800" text-anchor="middle" class="self" fill="#065f46">each tool call captured via AfterToolCallEvent</text>
  <text x="1310" y="820" text-anchor="middle" class="self" fill="#065f46">&#8594; Evidence assembled by code as it streams</text>

  <!-- 11. Subagent -> Code SubagentAnswer -->
  <line x1="1180" y1="892" x2="836" y2="892" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#s-arrow-open)"/>
  <text x="500" y="884" class="msg"><tspan class="msg-b">6.</tspan> SubagentAnswer (assessment, queries tagged by CIM category, gaps) &#8212; forced structured output, <tspan font-style="italic">no rows</tspan></text>

  <!-- 12. Code self project -->
  <path d="M830,920 h70 v26 h-64" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#s-arrow)"/>
  <text x="908" y="932" class="self" fill="#065f46">project typed SiemFindings / VtFindings &#183; mint citations &#183; every citation must resolve to a real evidence id</text>

  <!-- 13. Code self evaluate -->
  <path d="M830,970 h70 v26 h-64" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#s-arrow)"/>
  <text x="908" y="982" class="self" fill="#065f46">evaluate_step(CompletionRule) &#8594; StepOutcome (completed / evaluated / confirmed_empty / refused_for_budget)</text>

  <!-- budget settle note -->
  <rect x="600" y="1000" width="210" height="40" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.3"/>
  <text x="705" y="1025" text-anchor="middle" class="note">Budget: settle (credit unused)</text>

  <!-- 14. Code -> Broker digest -->
  <line x1="830" y1="1076" x2="486" y2="1076" stroke="#b91c1c" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#s-arrow-open)"/>
  <text x="360" y="1068" class="msg" fill="#991b1b"><tspan class="msg-b">7.</tspan> SubtaskResult &#8594; _digest() only &#8212; raw Evidence is withheld from the Broker's context</text>

  <!-- ===== end outer loop, after ===== -->
  <!-- 15. Broker -> Code TaskClassification -->
  <line x1="480" y1="1160" x2="824" y2="1160" stroke="#1e293b" stroke-width="2.2" marker-end="url(#s-arrow)"/>
  <text x="490" y="1152" class="msg"><tspan class="msg-b">8.</tspan> TaskClassification &#8212; <tspan font-style="italic">trailing</tspan> output: a report of what was dispatched</text>

  <!-- 16. Code -> Analyst BrokerReport -->
  <line x1="830" y1="1230" x2="156" y2="1230" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#s-arrow-open)"/>
  <text x="160" y="1222" class="msg"><tspan class="msg-b">9.</tspan> BrokerReport + Evidence written to report.json / evidence.json (.smartops/runs/&#8230;)</text>

  <!-- legend -->
  <g>
    <rect x="60" y="1280" width="1540" height="56" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <line x1="80" y1="1300" x2="130" y2="1300" stroke="#1e293b" stroke-width="2.2" marker-end="url(#s-arrow)"/>
    <text x="140" y="1305" class="ret" fill="#1e293b">solid = call / decision</text>
    <line x1="360" y1="1300" x2="410" y2="1300" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#s-arrow-open)"/>
    <text x="420" y="1305" class="ret">dashed = return / structured output</text>
    <line x1="720" y1="1300" x2="770" y2="1300" stroke="#b91c1c" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#s-arrow-open)"/>
    <text x="780" y="1305" class="ret" fill="#991b1b">red = digest-only crossing (evidence isolation)</text>
    <rect x="1170" y="1290" width="22" height="20" rx="4" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="1200" y="1305" class="ret">budget checkpoint</text>
  </g>
</svg>
