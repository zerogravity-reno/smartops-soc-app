[project]
name = "smartops-contracts"
version = "0.1.0"
description = "Shared data contracts for the SmartOps SOC multi-agent pipeline"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contracts"]
